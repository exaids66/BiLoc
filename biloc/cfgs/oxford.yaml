ckpt: '../checkpoints/biloc_oxford.pth'
seed: 7
exp_name: 'Oxford'
exp_dir: 'log/biloc_oxford'
sampling_timesteps: 10

train:
    batch_size: 40
    val_batch_size: 40
    image_size: [32, 512]
    original_image_size: [32, 512]
    steps: 3
    skip: 2
    restart_num: 5
    lr: 1e-3
    weight_decay: 0.01
    epochs: 120
    ckpt_interval: 1
    num_workers: 16
    eval_interval: 1
    print_interval: 200
    persistent_workers: True

    pin_memory: True
    clip_grad: 1.0

    cudnnbenchmark: True

    warmup_sche: True
    dataset: 'Oxford'
    dataroot: '../data'

profile: False

KD:
    teacher_cfg: '../diffoc_full_precision/cfgs/oxford.yaml'
    teacher_ckpt: '../checkpoints/your_diffloc_teacher_oxford.pth'

    weight: 0.8
    mask_ratio: 0.6
    loss_type: 'entropy'

    struct_weight: 0.05
    struct_loss_type: 'lckt'

    lckt_alpha: 0.5
    lckt_trans_w: 1.0
    lckt_rot_w: 1.0
    lckt_eps: 0.05
    lckt_T: 1
    lckt_K: 20

    kd_stop_epoch: null
    struct_stop_epoch: null

    importance_mode: 'ida_mask'

    sigma_map_dir: null
    sigma_filename: 'sigma.npy'
    sigma_missing: 'error'
    sigma_invert: True
    sigma_normalize: True

    kp_threshold: 0.5
    kp_tau: 1.0
    kp_use_sigmoid: True

    dual_alpha: 1.0

    t_min: 0.5
    t_max: 2.0

    it_alpha: 1.0
    it_n_data: 1

    s_dim: null
    t_dim: null


MODEL:
    _target_: models.DiffusionLocModel

    IMAGE_FEATURE_EXTRACTOR:
        _target_:               models.image_feature_extractor.ImageFeatureExtractor
        backbone:              "bhvit"
        freeze:                 False
        in_channels:            5
        new_patch_size:         [4, 16]
        new_patch_stride:       [4, 16]
        conv_stem:              'ConvStem'
        stem_base_channels:     32
        D_h:                    256
        image_size:             [32, 512]
        decoder:                'linear'
        pretrained_path:        null
        reuse_pos_emb:          true
        reuse_patch_emb:        false
        n_cls:                  1

    DENOISER:
        _target_: models.Denoiser
        TRANSFORMER:
            _target_:               models.denoiser.TransformerEncoderWrapper
            d_model:                512
            nhead:                  4
            num_encoder_layers:     8
            dim_feedforward:        1024
            dropout:                0.1
            norm_first:             True
            learnable_scaling:      True


    DIFFUSER:
        _target_: models.GaussianDiffusion
        beta_schedule: custom


sensors:
    name: 'Oxford32E'
    type: 'spherical'
    proj_h: 32
    proj_w: 512
    fov_up: 10.
    fov_down: -30.
    fov_left: -180
    fov_right: 180
    image_mean:
        - 5.05
        - 0.14
        - -0.77
        - -0.51
        - 8.43
        - 0

    image_stds:
         - 7.94
         - 5.12
         - 7.74
         - 1.04
         - 13.72
         - 1


# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: -45
  rot_yawmax: 45
